name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install ruff
        run: uv tool install ruff
      - run: uv sync
      - name: Lint
        run: uv run ruff check qdivzero_py tests examples
      - name: Test
        run: uv run pytest
